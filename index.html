<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المجتهد للعلوم الفيزيائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-gray-800">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">منصة المجتهد للعلوم الفيزيائية</h2>
            <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); window.login();">
                <div>
                    <label class="block mb-1 font-semibold">البريد الإلكتروني</label>
                    <input type="email" id="email" class="w-full border p-3 rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block mb-1 font-semibold">كلمة المرور</label>
                    <input type="password" id="password" class="w-full border p-3 rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition">دخول</button>
            </form>
            <div id="login-error" class="text-red-500 text-center mt-4 hidden">بيانات الدخول غير صحيحة</div>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- الشريط العلوي -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-800">منصة المجتهد للعلوم الفيزيائية</h1>
            <button onclick="window.logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">تسجيل الخروج</button>
        </header>

        <main class="flex-grow p-6">
            
            <!-- قسم التلميذ -->
            <div id="student-screen" class="hidden max-w-6xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-center">مرحباً بك في مساحتك التعليمية</h2>
                <div id="student-content-container"></div>
            </div>

            <!-- قسم الأستاذ -->
            <div id="admin-screen" class="hidden max-w-6xl mx-auto">
                
                <!-- الشاشة الرئيسية للأستاذ (البطاقات الرئيسية) -->
                <div id="admin-home-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                    <div onclick="window.openAdminSection('accounts')" class="bg-white border-2 border-indigo-200 p-8 rounded-xl shadow-sm cursor-pointer hover:shadow-md hover:border-indigo-500 transition text-center">
                        <h3 class="text-2xl font-bold text-indigo-700 mb-2">إدارة الحسابات</h3>
                        <p class="text-gray-500">تفعيل، تعديل، ومتابعة حسابات التلاميذ</p>
                    </div>
                    <div onclick="window.openAdminSection('content')" class="bg-white border-2 border-teal-200 p-8 rounded-xl shadow-sm cursor-pointer hover:shadow-md hover:border-teal-500 transition text-center">
                        <h3 class="text-2xl font-bold text-teal-700 mb-2">إدارة المحتوى</h3>
                        <p class="text-gray-500">إضافة وتعديل الدروس والوحدات</p>
                    </div>
                </div>

                <!-- قسم إدارة الحسابات -->
                <div id="admin-accounts-section" class="hidden">
                    <button onclick="window.returnToAdminHome()" class="mb-6 bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">← العودة للرئيسية</button>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-xl font-bold mb-4 border-b pb-2">قائمة حسابات التلاميذ</h3>
                        <div id="accounts-list-container" class="space-y-3">
                            <!-- سيتم ملء الحسابات هنا برمجياً -->
                            <p class="text-gray-500">جاري تحميل الحسابات...</p>
                        </div>
                    </div>
                </div>

                <!-- قسم إدارة المحتوى -->
                <div id="admin-content-section" class="hidden">
                    <button onclick="window.returnToAdminHome()" class="mb-6 bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">← العودة للرئيسية</button>
                    
                    <!-- بطاقات اختيار الطور -->
                    <div id="admin-tier-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div onclick="window.openAdminPart('middle')" class="bg-blue-50 border-2 border-blue-300 p-8 rounded-xl shadow-sm cursor-pointer hover:bg-blue-100 hover:border-blue-600 transition text-center">
                            <h3 class="text-2xl font-bold text-blue-800">التعليم المتوسط</h3>
                        </div>
                        <div onclick="window.openAdminPart('high')" class="bg-green-50 border-2 border-green-300 p-8 rounded-xl shadow-sm cursor-pointer hover:bg-green-100 hover:border-green-600 transition text-center">
                            <h3 class="text-2xl font-bold text-green-800">التعليم الثانوي</h3>
                        </div>
                    </div>

                    <!-- محتوى الطور المختار (السنوات والوحدات) -->
                    <div id="admin-tier-content" class="hidden mt-4">
                        <button onclick="window.returnToAdminParts()" class="mb-6 bg-red-100 text-red-800 px-4 py-2 rounded hover:bg-red-200 transition font-bold">↑ تغيير الطور</button>
                        <div id="admin-units-container" class="bg-white p-6 rounded-lg shadow">
                            <!-- سيتم رسم السنوات والوحدات هنا بناءً على الطور -->
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- ربط ملفات الجافاسكريبت -->
    <script src="js/app.js"></script>
    <script src="js/auth/auth.js"></script>
    <script src="js/ui/student.js"></script>
    <script src="js/ui/admin.js"></script>
</body>
</html>
